---
# Put things on the test hosts that the roles are expected to clean up, so
# verify can prove the cleanup happened.
- name: Prepare
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Prepare | Refresh apt index
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Prepare | Install a legacy client and an unneeded service
      ansible.builtin.package:
        name:
          - telnet
          - rpcbind
        state: present

    - name: Prepare | Install pwscore to test the password policy behaviour
      ansible.builtin.package:
        name: "{{ 'libpwquality-tools' if ansible_facts['os_family'] == 'Debian' else 'libpwquality' }}"
        state: present

    - name: Prepare | Create a legacy system account with a login shell
      ansible.builtin.user:
        name: legacysvc
        uid: 990
        system: true
        shell: /bin/bash
        create_home: false

    - name: Prepare | Pre-create the admin with a stray key the role must remove
      ansible.builtin.user:
        name: opsadmin
        shell: /bin/bash

    - name: Prepare | Add the stray key
      ansible.posix.authorized_key:
        user: opsadmin
        key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAISTRAYxxxxPLACEHOLDERxxxxMUSTxxxxBExxxxREMOVED stray-placeholder"

    - name: Prepare | Install kmod so verify can read the effective modprobe config
      ansible.builtin.package:
        name: kmod
        state: present
