---
# Assertions on the converged hosts, one file per role. Every check reads the
# real state of the container (files, sshd -T, package and unit state), not
# the variables that were passed in.
- name: Verify
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Verify | base
      ansible.builtin.import_tasks: verify/base.yml

    - name: Verify | users
      ansible.builtin.import_tasks: verify/users.yml

    - name: Verify | firewall
      ansible.builtin.import_tasks: verify/firewall.yml

    - name: Verify | ssh
      ansible.builtin.import_tasks: verify/ssh.yml

    - name: Verify | fail2ban
      ansible.builtin.import_tasks: verify/fail2ban.yml

    - name: Verify | kernel
      ansible.builtin.import_tasks: verify/kernel.yml

    - name: Verify | auditd
      ansible.builtin.import_tasks: verify/auditd.yml

    - name: Verify | updates
      ansible.builtin.import_tasks: verify/updates.yml
