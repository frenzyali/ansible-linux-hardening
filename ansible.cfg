[defaults]
# No default inventory on purpose: always pass -i explicitly, so nothing is
# ever configured against a host by accident.
roles_path = ./roles
collections_path = ./.ansible/collections
stdout_callback = default
result_format = yaml
callback_result_format = yaml
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
forks = 10

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
