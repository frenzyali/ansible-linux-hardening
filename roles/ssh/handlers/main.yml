---
# All three listen to "Apply sshd config" and run in this order.

# Ubuntu socket activation: re-run the generator so the socket picks up a
# changed Port/ListenAddress, then restart the socket. ssh.service uses
# KillMode=process, so open sessions survive.
- name: Regenerate SSH socket units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: ssh_os_socket_unit | length > 0
  listen: Apply sshd config

- name: Restart SSH socket
  ansible.builtin.systemd_service:
    name: "{{ ssh_os_socket_unit }}"
    state: restarted
  when: ssh_os_socket_unit | length > 0
  listen: Apply sshd config

# A reload keeps existing sessions; new connections get the new config.
- name: Reload sshd
  ansible.builtin.systemd_service:
    name: "{{ ssh_os_service }}"
    state: reloaded
  listen: Apply sshd config
