---
- name: Base | Configure chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ base_os_chrony_config }}"
    owner: root
    group: root
    mode: "0644"
    validate: chronyd -p -f %s
  notify: Restart chrony

- name: Base | Enable chrony at boot
  ansible.builtin.systemd_service:
    name: "{{ base_os_chrony_service }}"
    enabled: true

# chronyd needs CAP_SYS_TIME, which a container does not have (systemd skips
# the unit there). On real hosts it is started here.
- name: Base | Start chrony
  ansible.builtin.systemd_service:
    name: "{{ base_os_chrony_service }}"
    state: started
  when: base_runtime_apply | bool
