---
- name: Users | Create pwquality drop-in directory
  ansible.builtin.file:
    path: /etc/security/pwquality.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  register: users_pwquality_dir
  when: users_pwquality_enabled | bool

- name: Users | Configure password quality rules
  ansible.builtin.template:
    src: pwquality.conf.j2
    dest: /etc/security/pwquality.conf.d/60-hardening.conf
    owner: root
    group: root
    mode: "0644"
  when:
    - users_pwquality_enabled | bool
    - not (ansible_check_mode and users_pwquality_dir is changed)

- name: Users | Read the PAM password stack
  ansible.builtin.slurp:
    src: "{{ users_os_pam_password_file }}"
  register: users_pam_password
  when:
    - users_pwquality_enabled | bool
    - users_pwquality_require_pam | bool
    - not users_check_mode_pending

- name: Users | Assert pam_pwquality enforces the rules
  ansible.builtin.assert:
    that:
      - users_pam_password.content | b64decode is search('(?m)^password\s+\S+\s+pam_pwquality\.so')
    fail_msg: >-
      pam_pwquality.so is not in {{ users_os_pam_password_file }}, so the password
      quality rules would not be enforced. Enable it (pam-auth-update / authselect)
      or set users_pwquality_require_pam to false.
    quiet: true
  when:
    - users_pwquality_enabled | bool
    - users_pwquality_require_pam | bool
    - not users_check_mode_pending

- name: Users | Set password aging and umask defaults
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?\s*{{ item.key }}\s'
    line: "{{ item.key }}\t{{ item.value }}"
    state: present
  loop: "{{ users_login_defs | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: users_login_defs_enabled | bool
