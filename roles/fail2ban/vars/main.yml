---
# True only in check mode when EPEL or fail2ban is not installed yet: the
# jail directory and service do not exist, so those steps are skipped.
fail2ban_check_mode_pending: >-
  {{ ansible_check_mode and ((fail2ban_epel_install | default({})) is changed
                             or (fail2ban_packages_install | default({})) is changed) }}
