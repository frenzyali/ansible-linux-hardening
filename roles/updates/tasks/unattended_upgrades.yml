---
- name: Updates | Turn on the periodic apt jobs
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

# apt config lists are cumulative across files, so the origins from the
# packaged 50unattended-upgrades are cleared first ("#clear"); otherwise
# "security only" would silently include whatever that file allows.
- name: Updates | Choose which updates are installed
  ansible.builtin.template:
    src: 52unattended-upgrades-hardening.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-hardening
    owner: root
    group: root
    mode: "0644"
